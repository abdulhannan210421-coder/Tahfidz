<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Utama Tahfidz Sidogiri</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
    
    * {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #0f172a;
    }

    /* macOS Dock Physics & Animation Engine */
    .dock-container {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }

    .dock-wrapper {
      transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s ease-out;
      will-change: transform, opacity;
    }

    .dock-item {
      transition: transform 0.18s cubic-bezier(0.2, 0.8, 0.2, 1.2), margin 0.18s ease;
      will-change: transform;
      transform-origin: bottom center;
    }
  </style>
</head>
<body class="relative w-screen h-screen overflow-hidden bg-slate-950">

  <!-- VIEWPORT UTAMA: FULLSCREEN IFRAME MEMUAT WEB HTML -->
  <iframe id="mainViewport" src="Database Tahfidz.html" class="w-full h-full border-none block z-10"></iframe>

  <!-- INDIKATOR TEPI BAWAH LAYAR (PETUNJUK KURSOR) -->
  <div id="bottomDockTriggerZone" class="fixed bottom-0 left-0 right-0 h-3 z-40 cursor-pointer group flex justify-center items-end pb-1" title="Geser kursor ke sini untuk membuka Menu Dock">
    <div class="w-24 h-1 rounded-full bg-emerald-500/40 group-hover:bg-emerald-400 group-hover:w-36 transition-all duration-300 shadow-[0_0_12px_rgba(16,185,129,0.8)]"></div>
  </div>

  <!-- MACOS FLOATING DOCK NAVIGATION (AUTO-HIDE BY DEFAULT) -->
  <div id="macDockWrapper" class="dock-wrapper fixed bottom-4 left-1/2 -translate-x-1/2 z-50 transform translate-y-[140%] opacity-0 pointer-events-none">
    <div id="macDock" class="dock-container rounded-3xl px-4 py-3 flex items-center gap-3">
      <!-- Item menu otomatis di-render dari JS / menu.json -->
    </div>
  </div>

  <script>
    const DEFAULT_MODULES = [
      {
        id: "database",
        title: "Database Tahfidz",
        file: "Database Tahfidz.html",
        icon: "fa-book-quran",
        color: "from-emerald-500 to-teal-600"
      },
      {
        id: "tes",
        title: "Tes Berkala & Keuangan",
        file: "Tes Berkala.html",
        icon: "fa-clipboard-check",
        color: "from-blue-500 to-indigo-600"
      },
      {
        id: "presensi",
        title: "Presensi Takror",
        file: "Presensi.html",
        icon: "fa-calendar-check",
        color: "from-amber-500 to-orange-600"
      },
      {
        id: "perolehan",
        title: "Perolehan Lembar",
        file: "Perolehan.html",
        icon: "fa-chart-column",
        color: "from-rose-500 to-pink-600"
      }
    ];

    let appModules = DEFAULT_MODULES;
    let activeFile = "Database Tahfidz.html";

    /* ==========================================================
       1. INITIALIZATION & CONFIG LOADING
       ========================================================== */
    window.addEventListener('DOMContentLoaded', async () => {
      await fetchMenuConfig();
      renderDockUI();
      setupMacDockPhysics();
      setupAutoHideDockEngine();
    });

    async function fetchMenuConfig() {
      try {
        const resp = await fetch('menu.json');
        if (resp.ok) {
          const json = await resp.json();
          if (Array.isArray(json) && json.length > 0) {
            appModules = json;
          }
        }
      } catch (e) {
        console.warn("Menggunakan fallback array konfigurasi menu.");
      }
    }

    /* ==========================================================
       2. RENDER MACOS DOCK NAVIGATION
       ========================================================== */
    function renderDockUI() {
      const dock = document.getElementById('macDock');
      let dockHtml = '';

      appModules.forEach((mod) => {
        const isActive = activeFile === mod.file;
        dockHtml += `
          <div class="dock-item relative group flex items-center justify-center cursor-pointer" onclick="switchApp('${mod.file}', this)">
            <button class="w-12 h-12 sm:w-14 sm:h-14 rounded-2xl bg-gradient-to-tr ${mod.color} text-white flex items-center justify-center text-xl sm:text-2xl shadow-xl border border-white/20 active:scale-95 relative">
              <i class="fa-solid ${mod.icon}"></i>
              ${isActive ? '<span class="absolute -bottom-1.5 left-1/2 -translate-x-1/2 w-1.5 h-1.5 rounded-full bg-emerald-400 shadow-[0_0_8px_#34d399]"></span>' : ''}
            </button>
            <div class="absolute -top-12 left-1/2 -translate-x-1/2 bg-slate-900/95 text-white text-[11px] font-extrabold px-3 py-1.5 rounded-xl shadow-2xl border border-white/20 opacity-0 group-hover:opacity-100 transition-all duration-150 pointer-events-none whitespace-nowrap z-[100]">
              ${mod.title}
            </div>
          </div>
        `;
      });

      dock.innerHTML = dockHtml;
    }

    /* ==========================================================
       3. SWITCH WEB APP
       ========================================================== */
    function switchApp(fileUrl, element) {
      activeFile = fileUrl;
      const iframe = document.getElementById('mainViewport');
      iframe.src = fileUrl;
      renderDockUI();
      setupMacDockPhysics();
    }

    /* ==========================================================
       4. AUTO-HIDE DOCK ENGINE (MUNCUL KETIKA KURSOR KE BAWAH)
       ========================================================== */
    let isDockOpen = false;

    function setupAutoHideDockEngine() {
      const wrapper = document.getElementById('macDockWrapper');

      window.addEventListener('mousemove', (e) => {
        const screenHeight = window.innerHeight;
        const mouseY = e.clientY;

        // Buka Dock jika kursor mendekati 35px dari bawah layar
        if (mouseY >= screenHeight - 35 && !isDockOpen) {
          isDockOpen = true;
          wrapper.classList.remove('translate-y-[140%]', 'opacity-0', 'pointer-events-none');
          wrapper.classList.add('translate-y-0', 'opacity-100', 'pointer-events-auto');
        } else if (isDockOpen) {
          // Tutup Dock jika kursor bergerak jauh ke atas meninggalkan area Dock
          const rect = wrapper.getBoundingClientRect();
          if (mouseY < rect.top - 50 || e.clientX < rect.left - 50 || e.clientX > rect.right + 50) {
            isDockOpen = false;
            wrapper.classList.add('translate-y-[140%]', 'opacity-0', 'pointer-events-none');
            wrapper.classList.remove('translate-y-0', 'opacity-100', 'pointer-events-auto');
          }
        }
      });
    }

    /* ==========================================================
       5. MACOS DOCK MAGNIFICATION PHYSICS
       ========================================================== */
    function setupMacDockPhysics() {
      const dock = document.getElementById('macDock');
      
      dock.addEventListener('mousemove', (e) => {
        const items = dock.querySelectorAll('.dock-item');
        const maxDistance = 120;
        const maxScale = 1.45;

        const mouseX = e.clientX;

        items.forEach(item => {
          const rect = item.getBoundingClientRect();
          const itemCenterX = rect.left + rect.width / 2;
          const distance = Math.abs(mouseX - itemCenterX);

          if (distance < maxDistance) {
            const factor = Math.cos((distance / maxDistance) * (Math.PI / 2));
            const scale = 1 + (maxScale - 1) * Math.pow(factor, 2);
            const translateY = - (scale - 1) * 16;
            
            item.style.transform = `scale(${scale}) translateY(${translateY}px)`;
            item.style.margin = `0 ${ (scale - 1) * 10 }px`;
          } else {
            item.style.transform = 'scale(1) translateY(0px)';
            item.style.margin = '0 0px';
          }
        });
      });

      dock.addEventListener('mouseleave', () => {
        const items = dock.querySelectorAll('.dock-item');
        items.forEach(item => {
          item.style.transform = 'scale(1) translateY(0px)';
          item.style.margin = '0 0px';
        });
      });
    }
  </script>
</body>
</html>
